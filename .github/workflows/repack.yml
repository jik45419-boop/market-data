name: repack

# 一次性：把年度資料庫改成「連續月份、每包約 190MB」，可重複執行
on:
  workflow_dispatch:

permissions:
  contents: read

# 和每日更新共用同一組，避免同時改 Drive 上的數據包
concurrency:
  group: market-data
  cancel-in-progress: false

env:
  GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
  GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
  GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
  PYTHONUNBUFFERED: "1"

jobs:
  repack:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 重新打包
        run: python tools/repack.py
      - name: 清理 Drive 空間
        if: always()
        run: python tools/cleanup.py
      - name: 數據包大小
        if: always()
        run: python tools/pack_stats.py
